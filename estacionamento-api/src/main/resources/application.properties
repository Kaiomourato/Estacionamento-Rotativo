# Configurações de Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Pool de Conexões (Hikari)
# Otimizado para o Transaction Pooler do Supabase (Porta 6543)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=2000

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Forçar o dialeto do PostgreSQL para evitar problemas de auto-detecção
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Forçar o uso do esquema public
spring.jpa.properties.hibernate.default_schema=public

# Porta da Aplicação (Render usa a variável PORT, mas o Spring pode usar 8080 por padrão)
server.port=8080

# Logging para facilitar o diagnóstico em caso de erro
logging.level.root=INFO
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal=TRACE