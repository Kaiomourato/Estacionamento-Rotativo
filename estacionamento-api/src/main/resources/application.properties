server.port=${PORT:8080}

# URL do Transaction Pooler (porta 6543) com parâmetros obrigatórios
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?user=postgres.ehtexiipjkkjvzubosib&sslmode=require&prepareThreshold=0&connectTimeout=15
spring.datasource.username=postgres.ehtexiipjkkjvzubosib
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forçar o dialect (evita erro de metadata)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs para revelar o erro real
logging.level.org.hibernate=DEBUG
