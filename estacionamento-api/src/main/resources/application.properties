server.port=${PORT:8080}

# URL do Transaction Pooler (porta 6543) com parâmetros obrigatórios
# IMPORTANTE: Defina DB_PASSWORD como variável de ambiente no Render!
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?user=${DB_USER}&password=${DB_PASSWORD}&sslmode=require&prepareThreshold=0

spring.datasource.driver-class-name=org.postgresql.Driver

# Forçar o dialect (evita erro de metadata)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs para revelar o erro real
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG

# DIAGNÓSTICO TEMPORÁRIO — investigação do 500 intermitente em produção (painel ADM).
# Acusa no log (nível WARN) qualquer conexão do pool retida por mais de 30s sem ser
# devolvida — confirma ou descarta esgotamento do pool (HikariCP padrão = 10 conexões)
# como causa do erro. Remover depois de identificada a causa raiz.
spring.datasource.hikari.leak-detection-threshold=30000

api.security.token.secret=${JWT_SECRET:minha-senha-secreta-123}